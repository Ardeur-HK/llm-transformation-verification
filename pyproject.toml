[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-transformation-verification"
version = "0.1.0"
description = "Research prototype for checking evidence about local model transformations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==1.26.4",
    "peft==0.18.0",
    "safetensors==0.5.3",
    "tokenizers==0.22.2",
    "torch==2.8.0",
    "transformers==5.5.4",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["evidence_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
